security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|assets)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_account
            logout:
                path: app_logout
                target: home
                enable_csrf: true
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 1209600 # 2 weeks
            # Blocks brute force: max 5 failed logins per minute and per email/IP.
            login_throttling:
                max_attempts: 5

    # Pages are protected in the controllers with #[IsGranted].
    access_control:

when@test:
    security:
        password_hashers:
            # Hashing is deliberately slow; make it as fast as possible in tests.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
        firewalls:
            main:
                login_throttling: false
