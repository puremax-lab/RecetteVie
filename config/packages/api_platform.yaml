api_platform:
    title: RecetteVie API
    description: Recipes (read-only) and each member's meal plan, used by the Semainier app.
    version: 1.0.0
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
